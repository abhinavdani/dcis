services:
  - type: web
    name: dcis-backend
    env: python
    region: singapore          # closest free region to India
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python manage.py seed_cg_data
    startCommand: gunicorn dcis.wsgi --workers 2 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "dcis.onrender.com"
      - key: DATABASE_URL
        sync: false             # paste Neon connection string in Render dashboard
      - key: CORS_ALLOWED_ORIGINS
        value: "https://dcis-zeta.vercel.app"
      - key: MEDIA_ROOT
        value: "/tmp/media"     # ephemeral on free tier — fine for demo
